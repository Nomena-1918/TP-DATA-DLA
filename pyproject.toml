[project]
name = "tp-data-dla"
version = "0.1.0"
description = "Pipeline ETL, dedoublonnage Union-Find et mini-application NEW_ID / UID"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "mysql-connector-python>=9.1.0,<10",
    "psycopg[binary]>=3.2.0,<4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
tp-dla = "tp_data_dla.cli:main"

[dependency-groups]
notebook = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_data_dla"]
