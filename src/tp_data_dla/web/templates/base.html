<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Référentiel Client NEW_ID · TP DATA D.L.A{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <h1>Référentiel Client NEW_ID</h1>
        <p>Réconciliation d'identités &amp; Dédoublonnage non destructif (TP DATA D.L.A)</p>
      </div>
      <nav class="main-nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Tableau de bord</a>
        <a href="/recherche" class="{% if request.url.path.startswith('/recherche') or request.url.path.startswith('/groupes') %}active{% endif %}">Explorateur UID</a>
        <a href="/validation" class="{% if request.url.path.startswith('/validation') %}active{% endif %}">File de validation</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <p>TP DATA D.L.A · Architecture de rapprochement d'identités · Modèle non destructif par UUID</p>
  </footer>
</body>
</html>
